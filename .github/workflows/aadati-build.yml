name: Build Aadati APK
on:
  workflow_dispatch:
  push:
    branches: [main, aadati-flutter]
    paths:
      - 'aadati/**'
      - '.github/workflows/aadati-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aadati
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name aadati --org com.aadati --overwrite /tmp/aadati_android
          cp -R /tmp/aadati_android/android ./android
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: aadati-debug-apk
          path: aadati/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
