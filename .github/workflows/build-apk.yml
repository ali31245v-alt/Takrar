name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create Android project scaffolding
        run: flutter create . --platforms=android --org com.atcards
      - name: Set Android SDK and Takrar app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  s = re.sub(r"(?m)^.*compileSdk.*$", lambda m: "    compileSdk = 36" if name.endswith(".kts") else "    compileSdkVersion 36", s)
                  p.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              s = manifest.read_text().replace('android:label="at_cards"', 'android:label="تكرار"')
              manifest.write_text(s)
          adaptive = Path("android/app/src/main/res/mipmap-anydpi-v26")
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  f = adaptive / name
                  if f.exists(): f.unlink()
          PY
          grep -n "compileSdk" android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          python3 tool/generate_icon.py
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: at-cards-apk
          path: build/app/outputs/flutter-apk/app-release.apk
